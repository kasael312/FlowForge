[project]
name = "flowforge-backend"
version = "0.1.0"
description = "FlowForge backend: manage and execute AI coding pipelines."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "websockets>=12",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "mcp>=1.2",
    "croniter>=3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "readability-lxml>=0.8",
    "lxml>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
